# wpscatcher -- komt op de Zero in /etc/wpscatcher/config.ini

[wifi]
interface = wlan0
country = BE
conf = /etc/wpscatcher/wpa_supplicant.conf

# Het WPS-venster van de router is 120 s. Iets marge, anders geven we op
# net voor de router antwoordt.
window = 130
retry_delay = 10

# Ja = elke boot begint schoon, dus altijd echt via WPS. Zet op no als het
# toestel op één vast netwerk moet blijven hangen.
forget_on_boot = yes

# Voor de QR niet nodig; handig om via ssh te kunnen debuggen.
request_ip = yes

[display]
# Het enige dat je normaal moet aanpassen: 2in13, 2in9, 4in2 of 7in5.
# Driver, rotatie en schermmaat komen daar samen uit, zodat ze niet uit de
# pas kunnen lopen. Te overrulen zonder dit bestand te wijzigen met --panel.
panel = 4in2

# Ontsnappingsluik voor een paneel dat niet in de lijst staat: maak 'panel'
# leeg, dan gelden deze drie.
driver = epd4in2_V2
rotate = 0
preview_size = 400x300

# Waar de PNG's komen als er geen e-ink gevonden wordt (ontwikkelen op een pc).
preview_dir = preview

[ui]
title = wpscatcher

# Wachtwoord voluit onder de QR. Aan = laptops en desktops zonder camera
# kunnen het overtypen. Uit = het wachtwoord staat nergens leesbaar op het
# scherm; de QR wordt er nauwelijks groter van (zie de tabel in README.md).
show_password = yes

# E-ink houdt zijn beeld vast zonder stroom. Bij een nette stop het scherm
# wissen, zodat er geen klantwachtwoord op een uitgeschakeld toestel blijft
# staan. Geldt niet als het toestel zichzelf afsluit omdat de QR klaarstaat --
# dan is dat beeld juist de bedoeling.
clear_on_stop = yes

# Scherm wissen zodra het programma start. Haalt ghosting van de vorige
# sessie weg, en zorgt dat een half mislukte start niet de QR van de vorige
# klant laat staan.
clear_on_start = yes

[power]
# Seconden na het tonen van de QR voordat het toestel zichzelf netjes
# afsluit. Het e-ink houdt het beeld daarna vast zonder stroom, en er draait
# geen bestandssysteem meer als je de stekker eruit trekt -- dat is wat de
# SD-kaart sloopt.
#
# 0 = uit: blijven draaien en de verbinding bewaken.
# Zet dit pas aan als de eerste boot bewezen heeft dat alles werkt; anders
# schakelt het toestel zichzelf uit terwijl je nog aan het debuggen bent.
shutdown_after = 0

# Het scherm wissen vlak voor dat afsluiten. De QR is het wifi-wachtwoord van
# je klant in machineleesbare vorm, en e-ink houdt dat weken vast -- ook
# uitgeschakeld. Wissen voorkomt dat je dat in je tas meedraagt.
#
# Let op: eenmaal gewist krijg je het niet terug zonder opnieuw bij die router
# te staan. Kies shutdown_after dus ruim genoeg om de code te gebruiken;
# 900 (een kwartier) is een redelijk vertrekpunt.
blank_before_shutdown = no

# Na hoeveel mislukte WPS-pogingen opgeven en afsluiten. Eeuwig blijven
# proberen kost stroom; op accu is dat het verschil tussen een lege pack en
# een toestel dat je morgen gewoon aanzet. Eén poging is ~140 s.
# 0 = blijven proberen.
give_up_after = 0
