# wpscatcher -- komt op de Zero in /etc/wpscatcher/config.ini

[wifi]
interface = wlan0
country = BE
conf = /etc/wpscatcher/wpa_supplicant.conf

# Het WPS-venster van de router is 120 s. Iets marge, anders geven we op
# net voor de router antwoordt.
window = 130
retry_delay = 10

# Ja = elke boot begint schoon, dus altijd echt via WPS. Zet op no als het
# toestel op één vast netwerk moet blijven hangen.
forget_on_boot = yes

# Voor de QR niet nodig; handig om via ssh te kunnen debuggen.
request_ip = yes

[display]
# Het enige dat je normaal moet aanpassen: 2in13, 2in9, 4in2 of 7in5.
# Driver, rotatie en schermmaat komen daar samen uit, zodat ze niet uit de
# pas kunnen lopen. Te overrulen zonder dit bestand te wijzigen met --panel.
panel = 4in2

# Ontsnappingsluik voor een paneel dat niet in de lijst staat: maak 'panel'
# leeg, dan gelden deze drie.
driver = epd4in2_V2
rotate = 0
preview_size = 400x300

# Waar de PNG's komen als er geen e-ink gevonden wordt (ontwikkelen op een pc).
preview_dir = preview

[ui]
title = wpscatcher

# Wachtwoord voluit onder de QR. Aan = laptops en desktops zonder camera
# kunnen het overtypen. Uit = het wachtwoord staat nergens leesbaar op het
# scherm; de QR wordt er nauwelijks groter van (zie de tabel in README.md).
show_password = yes

# E-ink houdt zijn beeld vast zonder stroom. Bij een nette stop het scherm
# wissen, zodat er geen klantwachtwoord op een uitgeschakeld toestel blijft
# staan.
clear_on_stop = yes
